<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-page tags. scripts/prerender.mjs replaces this whole block for every
         page using src/seo/pages.ts; the values here only show in dev.
         The robots values matter: Google says they cap what may be used as input
         for AI Overviews and AI Mode, and -1/large opts fully in. -->
    <!--page-head-->
    <title>Angela Barhouch — Clinical Psychologist &amp; Psychotherapist in Beirut, Lebanon | CBT &amp; DBT</title>
    <!--/page-head-->

    <meta name="theme-color" content="#2E4636" />
    <!-- Dekwaneh is in Mount Lebanon Governorate (LB-JL), not Beirut (LB-BA). -->
    <meta name="geo.region" content="LB-JL" />
    <meta name="geo.placename" content="Dekwaneh, Greater Beirut, Lebanon" />
    <meta name="geo.position" content="33.8805;35.5422" />

    <!-- Marks that scripts run, so scroll-reveal only hides content for
         visitors who will actually see it revealed. Must stay before the CSS. -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- Icons (favicon.svg keeps the logo mark, if you ever want it back) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Social preview — WhatsApp, iMessage, Facebook, LinkedIn.
         Absolute URLs are required; JPEG because WhatsApp's crawler is
         unreliable with WebP. -->
    <meta property="og:site_name" content="Angela Barhouch" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__SITE_URL__/og-cover.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Angela Barhouch, licensed clinical psychologist and psychotherapist in Beirut"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-cover.jpg" />

    <!-- Fonts: Fraunces (warm display serif) + Mulish (friendly body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
